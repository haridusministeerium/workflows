# this workflow doesn't use the automatically generated GITHUB_TOKEN, but a GH App
# token (similar to PATs).
#
# to refernece output from previous jobs' output:   ${{needs.job1.outputs.output1}}
name: Build .egg

on:
  workflow_call:
    #inputs:
      #config-path:
        #required: true
        #type: string

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    # decrease our perms:
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false

    # from https://github.com/actions/runner-images/discussions/8135
    #- name: List all available programs
      #run: |
        #IFS=:
        #for dir in $PATH
        #do
            #for file in $dir/*
            #do
                #if [ -x $file ]
                #then
                    #echo $file
                #fi
            #done
        #done

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install setuptools & build egg
      run: |
        pip install --no-cache-dir setuptools
        python setup.py bdist_egg
    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: release-dist
        path: dist/

  version-tag-changelog:
    name: Version & tag the release
    if: ${{ github.ref == 'refs/heads/master' }}
    needs:
    - build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/create-github-app-token@v2
      id: app-token
      with:
        # required
        app-id: ${{ vars.APP_ID }}
        private-key: ${{ secrets.APP_KEY }}
    - uses: actions/checkout@v5
      with:
        token: ${{ steps.app-token.outputs.token }}
        ref: ${{ github.head_ref }}
        # Make sure the value of GITHUB_TOKEN will not be persisted in repo's config:
        persist-credentials: false
    - name: Get GitHub App User ID
      id: get-user-id
      run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
    #- id: committer
    #  run: echo "string=${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>"  >> "$GITHUB_OUTPUT"
    #- run: echo "committer string is ${{ steps.committer.outputs.string }}"
    - name: Configure git
      run: |
        git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
        git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
        # following url modification is so zestreleaser can push; see https://github.com/actions/create-github-app-token/issues/302
        git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf https://github.com/
        #git config --global user.name 'workflow-bot'
        #git config --global user.email 'ci@github'
    - name: Install zestreleaser & cut a tag
      run: |
        pip install zest.releaser
        fullrelease --no-input


  create-gh-release:
    name: >-
      Create GH release
    #if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    #if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    if: github.ref_type == 'tag'
    needs:
    - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: release-dist
        path: dist/
    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v3
      if: github.ref_type == 'tag'
      with:
        generate_release_notes: true
        working_directory: dist
        files: |
          *

